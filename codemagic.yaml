workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    # instance_type omitted on purpose. Codemagic picks the default Linux
    # instance for your plan automatically. Trying to pin `linux_x2` or
    # `linux` explicitly was failing with "selected instance type is not
    # available with the current billing plan" — letting Codemagic choose
    # avoids that. Add the pin back if/when you upgrade to a paid tier.

    environment:
      flutter: stable
      android_signing:
        - boyce_armory_keystore
      vars:
        PACKAGE_NAME: "com.boycearmory.investing"

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Set up key.properties for release signing
        script: |
          # build.gradle.kts looks for android/key.properties to pick the
          # release signing config. Codemagic exposes the keystore (uploaded
          # under the "boyce_armory_keystore" reference name) via these env
          # vars: CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS,
          # CM_KEY_PASSWORD. We translate those into the key.properties file
          # the Gradle script expects.
          #
          # Without this step the Gradle release build falls back to the
          # debug keystore and Play Console rejects the AAB with:
          #   "uploaded an APK or Android App Bundle signed in debug mode".
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build app bundle (.aab)
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true
    #
    # ^ Re-enable after creating a Google Cloud service account with Play
    # Console publishing access. For first ship: leave commented and upload
    # the AAB manually to Play Console → Internal testing → Create new release.

  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Boyce Armory"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.boycearmory.investing
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Clean iOS build artifacts
        script: |
          flutter clean
          flutter pub get
          rm -rf ios/Pods ios/Podfile.lock

      - name: Install pods
        working_directory: ios
        script: |
          pod install --repo-update

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Create export_options.plist
        script: |
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS (.ipa) for App Store
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
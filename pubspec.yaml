name: boyce_armory
description: Boyce Armory Investing - premium options trading education + live scanner alerts.
publish_to: "none"
version: 2.0.5+12

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
  

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_storage: ^12.3.3

  # Media
  image_picker: ^1.1.2

  # Networking (REST calls to our backend)
  http: ^1.2.2

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0

  cupertino_icons: ^1.0.8

  # Opens email composer + external URLs from Profile screen (support email,
  # legal links to terms/privacy). Required for in-app support workflow.
  url_launcher: ^6.3.1

  # Saves lesson chart images to the user's photo library when they tap
  # "Save" on the fullscreen viewer. Requires NSPhotoLibraryAddUsageDescription
  # on iOS (already declared in ios/Runner/Info.plist).
  gal: ^2.3.0

  # Charts for the performance / track-record screen (equity curve, monthly
  # P&L bars, setup breakdown, etc.). Pure-Dart, no native dependency, works
  # the same on iOS and Android.
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

  # Generates platform-specific launcher icons from a single source PNG.
  # Run after editing the flutter_launcher_icons block below:
  #   cd app && dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1

  # Generates platform-specific native splash screens (Android 12 / iOS).
  # Run after editing the flutter_native_splash block below:
  #   cd app && dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/branding/
    - assets/backgrounds/
    - assets/buttons/
    - assets/headers/
    - assets/learn/
    - assets/ticker_logos/

# -----------------------------------------------------------------------------
# Launcher icons (generated by flutter_launcher_icons).
# Source: assets/branding/app_icon.png (1024x1024 recommended for App Store).
# Run `cd app && dart run flutter_launcher_icons` to regenerate after editing.
# -----------------------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  # Adaptive icon for Android 8.0+ (background + foreground layers).
  adaptive_icon_background: "#050608"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21

# -----------------------------------------------------------------------------
# Native splash screen (generated by flutter_native_splash).
# Shows immediately on launch while the Flutter engine boots, then dissolves
# into the Dart-rendered splash screen.
# Run `cd app && dart run flutter_native_splash:create` to regenerate.
# -----------------------------------------------------------------------------
flutter_native_splash:
  color: "#050608"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#050608"
    image: "assets/branding/splash_logo.png"
  ios: true
  android: true
  web: false
  fullscreen: true

name: boyce_armory
description: Boyce Armory Investing - premium options trading education + live scanner alerts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_storage: ^12.3.3

  # Media
  image_picker: ^1.1.2

  # Networking (REST calls to our backend)
  http: ^1.2.2

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/branding/
    - assets/backgrounds/
    - assets/buttons/
    - assets/headers/
    - assets/learn/
    - assets/ticker_logos/
